<svg width="860" height="340" viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Space+Grotesk:wght@400;600;700&amp;display=swap');

      .title   { font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; fill: #e6edf3; }
      .sub     { font-family: 'Fira Code', monospace; font-size: 15px; fill: #58a6ff; }
      .mono    { font-family: 'Fira Code', monospace; font-size: 11px; }
      .sm      { font-family: 'Space Grotesk', sans-serif; font-size: 13px; fill: #8b949e; }
      .badge-t { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; }

      .typing { animation: typing 4.5s steps(44) infinite; }
      @keyframes typing {
        0%,100% { clip-path: inset(0 100% 0 0); }
        30%,70% { clip-path: inset(0 0% 0 0); }
      }

      .cursor { animation: blink 0.75s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

      .dot-pulse { animation: dpulse 2s ease-in-out infinite; }
      @keyframes dpulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    </style>
  </defs>

  <!-- background -->
  <rect width="860" height="340" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="859" height="339" rx="15.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- top bar -->
  <rect width="860" height="42" rx="16" fill="#161b22"/>
  <rect x="0" y="26" width="860" height="16" fill="#161b22"/>
  <line x1="0" y1="42" x2="860" y2="42" stroke="#30363d" stroke-width="0.8"/>
  <circle cx="22" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="21" r="6" fill="#febc2e"/>
  <circle cx="62" cy="21" r="6" fill="#28c840"/>
  <text x="80" y="25" class="mono" fill="#8b949e">README.md — GitHub Profile — sebastianccv</text>

  <!-- left accent bar -->
  <rect x="0" y="0" width="3.5" height="340" rx="3" fill="#58a6ff" opacity="0.5"/>

  <!-- main title -->
  <text x="430" y="120" text-anchor="middle" class="title">Systems Engineer &amp; Full-Stack Developer</text>

  <!-- subtitle typing -->
  <text x="210" y="152" class="sub typing">// aspiring AI Engineer | open to collaborate</text>
  <text x="655" y="152" class="sub cursor" font-size="15" font-family="'Fira Code',monospace">|</text>

  <!-- divider -->
  <line x1="60" y1="170" x2="800" y2="170" stroke="#21262d" stroke-width="0.8"/>

  <!-- badges — total width ~648, centered at 430, start at 106 -->
  <!-- Open to Work -->
  <rect x="106" y="184" width="138" height="28" rx="14" fill="#0d2119" stroke="#2ea043" stroke-width="0.9"/>
  <circle cx="126" cy="198" r="4.5" fill="#56d364" class="dot-pulse"/>
  <text x="136" y="202.5" class="badge-t" fill="#56d364">Open to Work</text>

  <!-- Full-Stack Dev -->
  <rect x="254" y="184" width="122" height="28" rx="14" fill="#0d1d2e" stroke="#1f6feb" stroke-width="0.9"/>
  <text x="315" y="202.5" text-anchor="middle" class="badge-t" fill="#58a6ff">Full-Stack Dev</text>

  <!-- AI Enthusiast -->
  <rect x="386" y="184" width="128" height="28" rx="14" fill="#1a1035" stroke="#8957e5" stroke-width="0.9"/>
  <text x="450" y="202.5" text-anchor="middle" class="badge-t" fill="#bc8cff">AI Enthusiast</text>

  <!-- Agile XP Scrum -->
  <rect x="524" y="184" width="150" height="28" rx="14" fill="#2d1800" stroke="#9e6a03" stroke-width="0.9"/>
  <text x="599" y="202.5" text-anchor="middle" class="badge-t" fill="#d29922">Agile · XP · Scrum</text>

  <!-- Bolivia -->
  <rect x="684" y="184" width="84" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="0.9"/>
  <text x="726" y="202.5" text-anchor="middle" class="badge-t" fill="#8b949e">BO Bolivia</text>

  <!-- divider -->
  <line x1="60" y1="226" x2="800" y2="226" stroke="#21262d" stroke-width="0.8"/>

  <!-- about lines -->
  <text x="430" y="258" text-anchor="middle" class="sm">Passionate about building projects with Artificial Intelligence</text>
  <text x="430" y="280" text-anchor="middle" class="sm">Agile methodologies · New Technologies · Continuous Learning</text>

  <!-- bottom -->
  <line x1="60" y1="308" x2="800" y2="308" stroke="#21262d" stroke-width="0.8"/>
  <text x="430" y="326" text-anchor="middle" font-family="'Fira Code',monospace" font-size="11" fill="#484f58">github.com/sebastianccv</text>
</svg>
