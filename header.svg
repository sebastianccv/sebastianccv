<svg width="860" height="380" viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Space+Grotesk:wght@400;600;700&amp;display=swap');

      .bg      { fill: #0d1117; }
      .title   { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; fill: #e6edf3; }
      .sub     { font-family: 'Fira Code', monospace; font-size: 15px; fill: #58a6ff; }
      .mono    { font-family: 'Fira Code', monospace; font-size: 11px; }
      .sm      { font-family: 'Space Grotesk', sans-serif; font-size: 13px; fill: #8b949e; }
      .badge-t { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; }

      .wave {
        transform-origin: 70% 70%;
        animation: wave 2s ease-in-out infinite;
      }
      @keyframes wave {
        0%,100% { transform: rotate(0deg); }
        25%     { transform: rotate(22deg); }
        75%     { transform: rotate(-12deg); }
      }

      .typing { animation: typing 4.5s steps(44) infinite; }
      @keyframes typing {
        0%,100% { clip-path: inset(0 100% 0 0); }
        30%,70% { clip-path: inset(0 0% 0 0); }
      }

      .cursor { animation: blink 0.75s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

      .dot-pulse { animation: dpulse 2s ease-in-out infinite; }
      @keyframes dpulse { 0%,100%{opacity:1;r:4.5} 50%{opacity:0.5;r:6} }

      .fadein { animation: fi 1.2s ease both; }
      @keyframes fi { from{opacity:0} to{opacity:1} }
    </style>
  </defs>

  <!-- background -->
  <rect width="860" height="380" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="859" height="379" rx="15.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- top bar -->
  <rect width="860" height="42" rx="16" fill="#161b22"/>
  <rect x="0" y="26" width="860" height="16" fill="#161b22"/>
  <line x1="0" y1="42" x2="860" y2="42" stroke="#30363d" stroke-width="0.8"/>
  <circle cx="22" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="21" r="6" fill="#febc2e"/>
  <circle cx="62" cy="21" r="6" fill="#28c840"/>
  <text x="80" y="25" class="mono" fill="#8b949e">README.md — GitHub Profile</text>

  <!-- left accent -->
  <rect x="0" y="0" width="3.5" height="380" rx="3" fill="#58a6ff" opacity="0.55"/>

  <!-- wave hand emoji -->
  <text x="430" y="110" font-size="38" text-anchor="middle" class="wave">👋</text>

  <!-- main title -->
  <text x="430" y="158" text-anchor="middle" class="title">Systems Engineer &amp; Full-Stack Developer</text>

  <!-- subtitle typing -->
  <g>
    <text x="218" y="186" class="sub typing">// aspiring AI Engineer | open to collaborate</text>
    <text x="650" y="186" class="sub cursor" font-size="15" font-family="'Fira Code',monospace">|</text>
  </g>

  <!-- divider -->
  <line x1="60" y1="202" x2="800" y2="202" stroke="#21262d" stroke-width="0.8"/>

  <!-- badges row — centrado en x=430, total ancho ~620, start x=120 -->
  <!-- Open to Work -->
  <rect x="96" y="216" width="130" height="26" rx="13" fill="#0d2119" stroke="#2ea043" stroke-width="0.9"/>
  <circle cx="115" cy="229" r="4.5" fill="#56d364" class="dot-pulse"/>
  <text x="124" y="233.5" class="badge-t" fill="#56d364">Open to Work</text>

  <!-- Full-Stack Dev -->
  <rect x="236" y="216" width="118" height="26" rx="13" fill="#0d1d2e" stroke="#1f6feb" stroke-width="0.9"/>
  <text x="295" y="233.5" text-anchor="middle" class="badge-t" fill="#58a6ff">Full-Stack Dev</text>

  <!-- AI Enthusiast -->
  <rect x="364" y="216" width="122" height="26" rx="13" fill="#1a1035" stroke="#8957e5" stroke-width="0.9"/>
  <text x="425" y="233.5" text-anchor="middle" class="badge-t" fill="#bc8cff">AI Enthusiast</text>

  <!-- Agile XP Scrum -->
  <rect x="496" y="216" width="146" height="26" rx="13" fill="#2d1800" stroke="#9e6a03" stroke-width="0.9"/>
  <text x="569" y="233.5" text-anchor="middle" class="badge-t" fill="#d29922">Agile · XP · Scrum</text>

  <!-- Bolivia -->
  <rect x="652" y="216" width="88" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="0.9"/>
  <text x="696" y="233.5" text-anchor="middle" class="badge-t" fill="#8b949e">🇧🇴 Bolivia</text>

  <!-- divider -->
  <line x1="60" y1="257" x2="800" y2="257" stroke="#21262d" stroke-width="0.8"/>

  <!-- about text -->
  <text x="430" y="286" text-anchor="middle" class="sm">Passionate about Artificial Intelligence · Agile methodologies · New Technologies</text>
  <text x="430" y="308" text-anchor="middle" class="sm">Full-Stack Web Development · Systems Engineering · Open to collaborate</text>

  <!-- bottom -->
  <line x1="60" y1="336" x2="800" y2="336" stroke="#21262d" stroke-width="0.8"/>
  <text x="430" y="358" text-anchor="middle" font-family="'Fira Code',monospace" font-size="11" fill="#484f58">github.com/TU_USUARIO</text>
</svg>
