<svg width="100%" viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Space+Grotesk:wght@400;600;700&amp;display=swap');

      .title   { font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; fill: #e6edf3; }
      .sub     { font-family: 'Fira Code', monospace; font-size: 18px; fill: #58a6ff; }
      .mono    { font-family: 'Fira Code', monospace; font-size: 13px; }
      .sm      { font-family: 'Space Grotesk', sans-serif; font-size: 15px; fill: #8b949e; }
      .badge-t { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 600; }

      .typing { animation: typing 4.5s steps(44) infinite; }
      @keyframes typing {
        0%,100% { clip-path: inset(0 100% 0 0); }
        30%,70% { clip-path: inset(0 0% 0 0); }
      }

      .cursor { animation: blink 0.75s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

      .dot-pulse { animation: dpulse 2s ease-in-out infinite; }
      @keyframes dpulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    </style>
  </defs>

  <!-- background -->
  <rect width="860" height="420" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="859" height="419" rx="15.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- top bar -->
  <rect width="860" height="46" rx="16" fill="#161b22"/>
  <rect x="0" y="30" width="860" height="16" fill="#161b22"/>
  <line x1="0" y1="46" x2="860" y2="46" stroke="#30363d" stroke-width="0.8"/>
  <circle cx="24" cy="23" r="7" fill="#ff5f57"/>
  <circle cx="46" cy="23" r="7" fill="#febc2e"/>
  <circle cx="68" cy="23" r="7" fill="#28c840"/>
  <text x="88" y="28" class="mono" fill="#8b949e">README.md — GitHub Profile — sebastianccv</text>

  <!-- left accent bar -->
  <rect x="0" y="0" width="4" height="420" rx="3" fill="#58a6ff" opacity="0.5"/>

  <!-- main title -->
  <text x="430" y="140" text-anchor="middle" class="title">Full-Stack Developer</text>

  <!-- subtitle typing -->
  <text x="192" y="178" class="sub typing">// aspiring AI Engineer | open to collaborate</text>
  <text x="672" y="178" class="sub cursor" font-size="18" font-family="'Fira Code',monospace">|</text>

  <!-- divider -->
  <line x1="60" y1="198" x2="800" y2="198" stroke="#21262d" stroke-width="0.8"/>

  <!-- badges row — 5 badges centrados -->
  <!-- Open to Work -->
  <rect x="68" y="214" width="160" height="34" rx="17" fill="#0d2119" stroke="#2ea043" stroke-width="1"/>
  <circle cx="92" cy="231" r="6" fill="#56d364" class="dot-pulse"/>
  <text x="104" y="235.5" class="badge-t" fill="#56d364">Open to Work</text>

  <!-- Full-Stack Dev -->
  <rect x="238" y="214" width="142" height="34" rx="17" fill="#0d1d2e" stroke="#1f6feb" stroke-width="1"/>
  <text x="309" y="235.5" text-anchor="middle" class="badge-t" fill="#58a6ff">Full-Stack Dev</text>

  <!-- AI Enthusiast -->
  <rect x="390" y="214" width="148" height="34" rx="17" fill="#1a1035" stroke="#8957e5" stroke-width="1"/>
  <text x="464" y="235.5" text-anchor="middle" class="badge-t" fill="#bc8cff">AI Enthusiast</text>

  <!-- Agile XP Scrum -->
  <rect x="548" y="214" width="170" height="34" rx="17" fill="#2d1800" stroke="#9e6a03" stroke-width="1"/>
  <text x="633" y="235.5" text-anchor="middle" class="badge-t" fill="#d29922">Agile · XP · Scrum</text>

  <!-- divider -->
  <line x1="60" y1="262" x2="800" y2="262" stroke="#21262d" stroke-width="0.8"/>

  <!-- about lines -->
  <text x="430" y="298" text-anchor="middle" class="sm">Passionate about building projects with Artificial Intelligence</text>
  <text x="430" y="322" text-anchor="middle" class="sm">Agile methodologies · New Technologies · Continuous Learning</text>

  <!-- bottom -->
  <line x1="60" y1="368" x2="800" y2="368" stroke="#21262d" stroke-width="0.8"/>
  <text x="430" y="394" text-anchor="middle" font-family="'Fira Code',monospace" font-size="13" fill="#484f58">github.com/sebastianccv</text>
</svg>
